# Cluster-scoped (not a namespaced Role) because `nodes` and the
# metrics.k8s.io `nodes`/`pods` resources are cluster-scoped -- a
# namespaced Role cannot grant access to them. Read-only, minimal verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-dashboard-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

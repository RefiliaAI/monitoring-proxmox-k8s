# Template only -- copy this to secret.yaml, fill in real values, and
# apply it separately. secret.yaml is gitignored and must never be committed.
#
#   cp secret.example.yaml secret.yaml
#   # edit secret.yaml with your real Proxmox API token
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-dashboard-secret
  namespace: monitoring
type: Opaque
stringData:
  # Create via Proxmox UI: Datacenter -> Permissions -> API Tokens.
  # Use a token with the PVEAuditor role (read-only) scoped to this token.
  PROXMOX_TOKEN_ID: "monitoring@pve!dashboard"
  PROXMOX_TOKEN_SECRET: "REPLACE_ME"

  # Optional -- FRITZ!Box router login, used to list every LAN client
  # (phones, laptops, IoT, ...) via its TR-064 API. Create a dedicated
  # FRITZ!Box user for this rather than reusing your main admin login.
  # Leave both blank/remove to disable LAN device discovery entirely.
  FRITZBOX_USERNAME: "monitoring"
  FRITZBOX_PASSWORD: "REPLACE_ME"
